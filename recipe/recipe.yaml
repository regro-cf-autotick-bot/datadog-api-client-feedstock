schema_version: 1

context:
  version: "2.62.0"

package:
  name: datadog-api-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/datadog-api-client/datadog_api_client-${{ version }}.tar.gz
  sha256: fec6a649dac5dd7224f64662390005e6d6ce688029742278346f46190d0fc902

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=30.3.0
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}
    - urllib3 >=1.15
    - certifi
    - python-dateutil
    - typing_extensions >=4.0.0

tests:
  - python:
      imports:
        - datadog_api_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Collection of all Datadog Public endpoints
  license: BSD-4-Clause-UC AND Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
    - LICENSE-3rdparty.csv
  homepage: https://github.com/DataDog/datadog-api-client-python
  documentation: https://docs.datadoghq.com/api/

extra:
  recipe-maintainers:
    - noya-gol
